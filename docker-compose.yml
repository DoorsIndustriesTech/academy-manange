services:
  targets-db:
    image: postgres:bookworm
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    env_file:
      - .env
  targets-web:
    build: .
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    # ports:
    #   - 8000:8000
    env_file:
      - .env
    depends_on:
      - targets-db
  targets-nginx:
    image: nginx:latest
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - targets-web

volumes:
  postgres_data:
  static_volume:
  media_volume: